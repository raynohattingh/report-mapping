installed:
- companion
- superspec
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: companion
    command: speckit.companion.capture
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.capture?
    description: Record specify completion (currentStep=specify, status=specified)
      into .spec-context.json
    condition: null
  after_plan:
  - extension: companion
    command: speckit.companion.capture-plan
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.capture-plan?
    description: Record plan completion (currentStep=plan, status=planned) into .spec-context.json
    condition: null
  after_tasks:
  - extension: companion
    command: speckit.companion.capture-tasks
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.capture-tasks?
    description: Record tasks completion (currentStep=tasks, status=ready-to-implement)
      into .spec-context.json
    condition: null
  - extension: superspec
    command: speckit.superspec.tasks
    enabled: true
    optional: true
    priority: 10
    prompt: Run enhanced Superpowers task decomposition and validation?
    description: Verify task coverage and add Superpowers execution markers after
      core task generation
    condition: null
  after_implement:
  - extension: companion
    command: speckit.companion.capture-implement
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.companion.capture-implement?
    description: Per-task journaling on implement (currentStep=implement; status=implemented
      when all tasks checked)
    condition: null
  - extension: superspec
    command: speckit.superspec.review
    enabled: true
    optional: true
    priority: 10
    prompt: Run Superpowers review against the specification and implementation?
    description: Review implementation against the spec, plan, tasks, and constitution
    condition: null
  before_implement:
  - extension: superspec
    command: speckit.superspec.execute
    enabled: true
    optional: true
    priority: 10
    prompt: Run Superpowers-guided implementation with TDD and checkpoints?
    description: Enforce TDD discipline and Superpowers execution guidance before
      core implementation
    condition: null
