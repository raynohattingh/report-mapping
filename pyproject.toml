[project]
name = "rmu"
version = "0.1.0"
description = "Report-Mapping Utility v1 - map once, convert many"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "docxtpl>=0.16",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "fastembed>=0.8.0",
    "pypdf>=6.14.2",
    "reportlab>=4.0",
]

[project.scripts]
rmu = "rmu.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "python-docx>=1.1",
]
# D11: Mapping Studio (feature 004) server deps — optional so the core install
# is unchanged and the suite stays green without the studio (FR-042).
studio = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmu"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: performance smoke tests against real local AI assets (SC-008); auto-skip when absent",
]
